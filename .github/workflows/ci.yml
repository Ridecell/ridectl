name: CI
on:
  push:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    env:
      TOKEN: ${{ secrets.RIDECELL_PUBLIC_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Setup gitconfig fot private go module
        run: |
          git config --global url."https://${TOKEN}:x-oauth-basic@github.com/Ridecell".insteadOf "https://github.com/Ridecell"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout 5m
          skip-cache: true

  build:
    name: Build (all platforms)
    runs-on: ubuntu-24.04
    needs: lint
    env:
      TOKEN: ${{ secrets.RIDECELL_PUBLIC_REPO_TOKEN }}
      TSH_VERSION: 18.7.2
    steps:
      - uses: actions/checkout@v7

      - name: Setup go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup gitconfig for private go modules
        run: |
          git config --global url."https://${TOKEN}:x-oauth-basic@github.com/Ridecell".insteadOf "https://github.com/Ridecell"

      - name: Build macOS (darwin/arm64)
        run: |
          rm -rf teleport*
          wget -q https://get.gravitational.com/teleport-v${TSH_VERSION}-darwin-arm64-bin.tar.gz
          tar -xf teleport-v${TSH_VERSION}-darwin-arm64-bin.tar.gz
          cp teleport/tsh.app/Contents/MacOS/tsh pkg/exec/bin/
          TSH_MD5=$(md5sum pkg/exec/bin/tsh | awk '{ print $1 }' | tr -d '\n')
          GOOS=darwin GOARCH=arm64 go build -o bin/ridectl.macos \
            -ldflags "-X github.com/Ridecell/ridectl/pkg/exec.tshMD5=${TSH_MD5} -X github.com/Ridecell/ridectl/pkg/cmd.version=$(git describe --tags)" \
            -tags release github.com/Ridecell/ridectl/cmd/ridectl

      - name: Build Linux amd64
        run: |
          rm -rf teleport*
          wget -q https://get.gravitational.com/teleport-v${TSH_VERSION}-linux-amd64-bin.tar.gz
          tar -xf teleport-v${TSH_VERSION}-linux-amd64-bin.tar.gz
          cp teleport/tsh pkg/exec/bin/
          TSH_MD5=$(md5sum teleport/tsh | awk '{ print $1 }' | tr -d '\n')
          GOOS=linux GOARCH=amd64 go build -o bin/ridectl.linux \
            -ldflags "-X github.com/Ridecell/ridectl/pkg/exec.tshMD5=${TSH_MD5} -X github.com/Ridecell/ridectl/pkg/cmd.version=$(git describe --tags)" \
            -tags release github.com/Ridecell/ridectl/cmd/ridectl

      - name: Build Linux arm64
        run: |
          rm -rf teleport*
          wget -q https://get.gravitational.com/teleport-v${TSH_VERSION}-linux-arm64-bin.tar.gz
          tar -xf teleport-v${TSH_VERSION}-linux-arm64-bin.tar.gz
          cp teleport/tsh pkg/exec/bin/
          TSH_MD5=$(md5sum teleport/tsh | awk '{ print $1 }' | tr -d '\n')
          GOOS=linux GOARCH=arm64 go build -o bin/ridectl.linux.arm64 \
            -ldflags "-X github.com/Ridecell/ridectl/pkg/exec.tshMD5=${TSH_MD5} -X github.com/Ridecell/ridectl/pkg/cmd.version=$(git describe --tags)" \
            -tags release github.com/Ridecell/ridectl/cmd/ridectl

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mv bin/ridectl.macos bin/ridectl && zip -jrm bin/ridectl_macos.zip bin/ridectl
          mv bin/ridectl.linux bin/ridectl && zip -jrm bin/ridectl_linux.zip bin/ridectl
          mv bin/ridectl.linux.arm64 bin/ridectl && zip -jrm bin/ridectl_linux_arm64.zip bin/ridectl
          go install github.com/tcnksm/ghr@v0.18.2
          ghr -c ${{ github.sha }} ${{ github.ref_name }} bin/
